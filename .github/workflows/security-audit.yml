name: Security audit

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Weekly Monday 06:17 UTC (odd minute to avoid cron thundering herd)
    - cron: "17 6 * * 1"

jobs:
  npm-audit:
    name: npm audit (high/critical)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            package.json
            apps/backend/package.json
            apps/frontend/package.json

      - name: Install
        run: npm install --no-audit --no-fund --include=dev

      - name: Audit
        run: npm audit --audit-level=high || (echo "::warning::npm audit found issues; see log above" && exit 0)
