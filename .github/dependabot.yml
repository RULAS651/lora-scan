version: 2
updates:
  # Root workspace npm deps (frontend + backend inherit via workspaces)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    groups:
      non-breaking-dev:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      non-breaking-production:
        dependency-type: "production"
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 10
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps):"
      include: "scope"

  # Security updates only for GitHub Actions themselves
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "chore(ci):"
